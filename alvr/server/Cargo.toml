[package]
name = "alvr_server"
version = "18.2.3"
authors = ["alvr-org", "polygraphene", "Valve Corporation"]
license = "MIT"
edition = "2021"
rust-version = "1.58"

[lib]
crate-type = ["cdylib"]

[features]
default = []
bundled_ffmpeg = []
gpl = []

[dependencies]
alvr_audio = { path = "../audio" }
alvr_commands = { path = "../commands" }
alvr_common = { path = "../common" }
alvr_filesystem = { path = "../filesystem" }
alvr_session = { path = "../session" }
alvr_sockets = { path = "../sockets" }
settings-schema = { path = "../settings-schema", features = [
    "rename_camel_case",
] }

# Basic utilities
chrono = "0.4"
parking_lot = "0.13"
# Serialization
serde = "1"
serde_json = "1"
# Async
futures = "0.3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "net",
    "fs",
    "time",
    "sync",
] }
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
wgpu = "30"
# Desktop UI
eframe = "0.37"
winit = "0.30" # platform extensions to run the dashboard event loop off the main thread
# Miscellaneous
fern = "0.7"

[build-dependencies]
alvr_filesystem = { path = "../filesystem" }
bindgen = "0.73"
cc = { version = "1", features = ["parallel"] }
walkdir = "2"

[target.'cfg(unix)'.build-dependencies]
pkg-config = "0.3.9"
